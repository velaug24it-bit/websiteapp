    <!-- PWA Early Install Prompt Capture & Immediate Service Worker Registration -->
    <script>
      (function() {
        window.__pwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__pwaPrompt = e;
          console.log('[PWA] beforeinstallprompt captured early');
          window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        });
        window.addEventListener('appinstalled', function() {
          window.__pwaPrompt = null;
          console.log('[PWA] appinstalled captured');
          window.dispatchEvent(new CustomEvent('pwa-installed'));
        });
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] SW registered early:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] SW early registration notice:', err);
            });
        }
      })();
    </script>
